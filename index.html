<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OmniTrivia</title>
    <!-- Orbitron for the HUD labels (question numbers, VS, the clock) and
         Exo 2 for the questions and answers themselves: rounded and futuristic,
         and open enough to read from the back of a room. Both fall back to the
         system sans, so a blocked font costs looks, not legibility. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700;800&family=Orbitron:wght@600;800;900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              neon: {
                pink: "#ff00ff",
                blue: "#00ffff",
                purple: "#bc13fe",
                green: "#0aff00",
                yellow: "#faff00",
              },
              dark: {
                bg: "#0f172a",
                card: "#1e293b",
              },
            },
            fontFamily: {
              hud: ["Orbitron", "Segoe UI", "system-ui", "sans-serif"],
              cyber: ['"Exo 2"', "Segoe UI", "system-ui", "sans-serif"],
            },
            animation: {
              "spin-slow": "spin 3s linear infinite",
              "pulse-fast": "pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite",
              "bounce-short": "bounce 0.5s infinite",
            },
            textShadow: {
              "neon-blue": "0 0 5px #00ffff, 0 0 10px #00ffff",
              "neon-pink": "0 0 5px #ff00ff, 0 0 10px #ff00ff",
            },
          },
        },
      };
    </script>
    <style>
      body {
        background-color: #0f172a;
        color: white;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        overflow-x: hidden;
      }
      /* What the page shows before React mounts — and, if the bundle never
         arrives, what it shows instead of nothing at all. */
      .boot {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        text-align: center;
        padding: 24px;
      }
      .boot-mark {
        font-size: 2rem;
        font-weight: 900;
        letter-spacing: -0.03em;
        color: #00ffff;
      }
      .boot-mark span {
        color: #fff;
      }
      .boot-note {
        color: #94a3b8;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.8rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        max-width: 28rem;
        line-height: 1.6;
      }
      .boot-action {
        margin-top: 8px;
        padding: 12px 24px;
        border-radius: 12px;
        border: 2px solid #ff00ff;
        background: transparent;
        color: #ff00ff;
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
      }
      .neon-text {
        text-shadow:
          0 0 5px #fff,
          0 0 10px #fff,
          0 0 20px #00ffff,
          0 0 30px #00ffff,
          0 0 40px #00ffff;
      }
      .neon-box {
        box-shadow:
          0 0 5px #00ffff,
          0 0 10px #00ffff;
      }
      .neon-box-pink {
        box-shadow:
          0 0 5px #ff00ff,
          0 0 10px #ff00ff;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1e293b;
      }
      ::-webkit-scrollbar-thumb {
        background: #bc13fe;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #ff00ff;
      }
      .text-neon-shadow {
        text-shadow:
          0 0 8px rgba(0, 255, 255, 0.7),
          0 0 12px rgba(0, 255, 255, 0.5);
      }

      /* ------------------------------------------------------------------
       * Neon-noir, drawn like the Grid: how a question and its answers look on
       * the phones and on the big screen.
       *
       * Everything is a rounded shape outlined in a line of light — a bright
       * 2px edge, a soft glow outside it, a faint glow inside — on near-black.
       * No cut corners, no hairlines. Neon blue and purple lead; every answer
       * keeps its own colour so the room can call it by colour as well as by
       * letter.
       *
       * Readability is the rule the look bends around: text is near-white on
       * near-black at full weight, and glow sits on edges and accents, never
       * on body copy.
       * ------------------------------------------------------------------ */
      :root {
        --grid-blue: #00e5ff;
        --grid-purple: #9d4dff;
        --grid-magenta: #ff2bd6;
        --grid-ink: rgba(7, 8, 22, 0.94);
      }

      /* The floor of the Grid, faint, behind a whole screen. */
      .tron-backdrop {
        background-color: #070817;
        background-image:
          radial-gradient(ellipse 80% 55% at 50% -10%, rgba(157, 77, 255, 0.20), transparent 70%),
          radial-gradient(ellipse 70% 50% at 50% 115%, rgba(0, 229, 255, 0.14), transparent 70%),
          linear-gradient(rgba(0, 229, 255, 0.055) 1px, transparent 1px),
          linear-gradient(90deg, rgba(157, 77, 255, 0.055) 1px, transparent 1px);
        background-size: 100% 100%, 100% 100%, 56px 56px, 56px 56px;
        background-position: center, center, center top, center top;
      }

      .cyber-panel {
        position: relative;
        border-radius: 22px;
        /* The fill, and under it a gradient that shows only in the border
           ring: an edge that runs blue into purple into magenta. */
        border: 2px solid transparent;
        background:
          linear-gradient(180deg, rgba(16, 14, 40, 0.97), rgba(7, 8, 22, 0.98)) padding-box,
          linear-gradient(135deg, var(--grid-blue), var(--grid-purple) 55%, var(--grid-magenta)) border-box;
        box-shadow:
          0 0 0 1px rgba(0, 229, 255, 0.10),
          0 0 22px rgba(0, 229, 255, 0.22),
          0 0 46px rgba(157, 77, 255, 0.16),
          inset 0 0 36px rgba(157, 77, 255, 0.12);
      }
      /* A second, fainter trace just inside the edge — the doubled light line
         the Grid draws its shapes with. */
      .cyber-panel::before {
        content: "";
        position: absolute;
        inset: 5px;
        border-radius: 16px;
        border: 1px solid rgba(0, 229, 255, 0.16);
        pointer-events: none;
      }
      /* A soft sheen across the top, so the panel reads as lit glass. */
      .cyber-panel::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 20px;
        pointer-events: none;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.045), transparent 38%);
      }
      .cyber-question {
        font-family: "Exo 2", "Segoe UI", system-ui, sans-serif;
        font-weight: 800;
        color: #f8fafc;
        letter-spacing: 0.005em;
        text-shadow: 0 0 20px rgba(0, 229, 255, 0.25);
      }
      .cyber-hud {
        font-family: Orbitron, "Segoe UI", system-ui, sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.22em;
      }

      /* One answer. `--accent` / `--accent-rgb` are set per option, so each
         choice keeps its own colour everywhere it appears. */
      .cyber-option {
        --accent: #00e5ff;
        --accent-rgb: 0, 229, 255;
        position: relative;
        display: flex;
        align-items: center;
        width: 100%;
        text-align: left;
        color: #f8fafc;
        font-family: "Exo 2", "Segoe UI", system-ui, sans-serif;
        font-weight: 700;
        border-radius: 18px;
        border: 2px solid rgba(var(--accent-rgb), 0.75);
        background:
          radial-gradient(120% 140% at 0% 50%, rgba(var(--accent-rgb), 0.20), transparent 55%),
          var(--grid-ink);
        box-shadow:
          0 0 14px rgba(var(--accent-rgb), 0.28),
          inset 0 0 20px rgba(var(--accent-rgb), 0.10);
        transition:
          transform 140ms ease,
          box-shadow 180ms ease,
          background 180ms ease,
          border-color 180ms ease,
          opacity 200ms ease,
          filter 200ms ease;
      }
      button.cyber-option:not(:disabled):hover {
        transform: translateY(-2px);
        border-color: var(--accent);
        box-shadow:
          0 0 22px rgba(var(--accent-rgb), 0.5),
          0 0 44px rgba(var(--accent-rgb), 0.18),
          inset 0 0 26px rgba(var(--accent-rgb), 0.18);
      }
      button.cyber-option:not(:disabled):active {
        transform: scale(0.98);
      }
      button.cyber-option:focus-visible {
        outline: 3px solid rgba(var(--accent-rgb), 0.9);
        outline-offset: 3px;
      }
      /* The letter: a glowing disc of the option's colour. */
      .cyber-option-key {
        font-family: Orbitron, "Segoe UI", system-ui, sans-serif;
        font-weight: 900;
        color: #05060f;
        border-radius: 999px;
        background: radial-gradient(circle at 35% 30%, #ffffff 0, var(--accent) 45%, rgba(var(--accent-rgb), 0.85) 100%);
        box-shadow:
          0 0 12px rgba(var(--accent-rgb), 0.75),
          0 0 26px rgba(var(--accent-rgb), 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      /* Locked in: the pick lights up, everything else steps back. No colour
         here ever means right or wrong — that is for the end of the match. */
      .cyber-option.is-picked {
        border-color: var(--accent);
        background:
          radial-gradient(140% 160% at 0% 50%, rgba(var(--accent-rgb), 0.42), rgba(var(--accent-rgb), 0.12) 70%),
          var(--grid-ink);
        box-shadow:
          0 0 26px rgba(var(--accent-rgb), 0.6),
          0 0 60px rgba(var(--accent-rgb), 0.22),
          inset 0 0 30px rgba(var(--accent-rgb), 0.3);
      }
      .cyber-option.is-muted {
        opacity: 0.32;
        filter: grayscale(0.7);
      }

      /* A clock as a light cycle's trail: a rounded track and a glowing run. */
      .cyber-timer {
        position: relative;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(7, 8, 22, 0.92);
        border: 2px solid rgba(0, 229, 255, 0.35);
        box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.6), 0 0 12px rgba(0, 229, 255, 0.12);
      }
      .cyber-timer-fill {
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--grid-purple), var(--grid-blue));
        box-shadow: 0 0 14px rgba(0, 229, 255, 0.75);
        transition: width 1s linear;
      }
      .cyber-timer-fill.is-urgent {
        background: linear-gradient(90deg, var(--grid-magenta), #ff3b3b);
        box-shadow: 0 0 16px rgba(255, 59, 59, 0.85);
      }

      /* A field a player types into, or a tile they drag. */
      .cyber-input {
        font-family: "Exo 2", "Segoe UI", system-ui, sans-serif;
        font-weight: 700;
        color: #f8fafc;
        border-radius: 16px;
        background: var(--grid-ink);
        border: 2px solid rgba(0, 229, 255, 0.6);
        box-shadow: 0 0 14px rgba(0, 229, 255, 0.18), inset 0 0 18px rgba(0, 229, 255, 0.08);
        outline: none;
      }
      .cyber-input:focus {
        border-color: var(--grid-blue);
        box-shadow:
          0 0 22px rgba(0, 229, 255, 0.45),
          inset 0 0 18px rgba(0, 229, 255, 0.15);
      }

      @keyframes cyber-flicker {
        0%, 19%, 21%, 62%, 64%, 100% { opacity: 1; }
        20%, 63% { opacity: 0.55; }
      }
      .cyber-flicker {
        animation: cyber-flicker 2.8s infinite;
      }
      /* The home screen's logo badge: a ring whose glow breathes slowly
         between magenta and purple, so the mark inside stays at full strength
         instead of fading with it. */
      @keyframes logo-halo {
        0%, 100% {
          box-shadow: 0 0 22px rgba(255, 0, 255, 0.55), 0 0 60px rgba(157, 77, 255, 0.25);
        }
        50% {
          box-shadow: 0 0 34px rgba(255, 0, 255, 0.85), 0 0 90px rgba(0, 229, 255, 0.30);
        }
      }
      .logo-halo {
        animation: logo-halo 2.8s ease-in-out infinite;
        box-shadow: 0 0 26px rgba(255, 0, 255, 0.65), 0 0 70px rgba(157, 77, 255, 0.25);
      }
      @media (prefers-reduced-motion: reduce) {
        .logo-halo { animation: none; }
        .cyber-flicker { animation: none; }
        .cyber-option, .cyber-timer-fill { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <div class="boot-mark">OMNI<span>TRIVIA</span></div>
        <div class="boot-note" id="boot-note">Loading…</div>
        <button class="boot-action" id="boot-reload" hidden>Reload the page</button>
      </div>
    </div>

    <script>
      /**
       * The blank-screen guard.
       *
       * Every deploy renames the bundle, and this page is cached for ten
       * minutes. A phone that opened the site just before a deploy therefore
       * asks for a file that no longer exists — and because the host serves a
       * copy of this page for anything it cannot find, the browser is handed
       * HTML where it expected JavaScript, refuses it, and renders nothing.
       * The result is a dark, empty screen in someone's hand in the middle of
       * a game, with no way to tell it apart from a dead connection.
       *
       * So: notice that the app never started, and reload once against a fresh
       * URL. One reload only — a loop would be worse than the blank screen —
       * and if that does not fix it, say so in words with a button.
       */
      (function () {
        var RECOVERY_KEY = "omnitrivia:recovered-once";
        var GRACE_MS = 8000;
        var recovering = false;

        var booted = function () {
          var root = document.getElementById("root");
          return !!root && root.getAttribute("data-booted") === "1";
        };

        var already = function () {
          try {
            return sessionStorage.getItem(RECOVERY_KEY) === "1";
          } catch (error) {
            // Private mode: no memory of a previous attempt, so err towards
            // the message rather than risking a reload loop.
            return true;
          }
        };

        var giveUp = function () {
          var note = document.getElementById("boot-note");
          var button = document.getElementById("boot-reload");
          if (note) {
            note.textContent =
              "This page could not load the game. Close the tab and open the link again — or reload below.";
          }
          if (button) {
            button.hidden = false;
            button.onclick = function () {
              try {
                sessionStorage.removeItem(RECOVERY_KEY);
              } catch (error) {
                /* nothing to clear */
              }
              window.location.reload();
            };
          }
        };

        var recover = function () {
          if (recovering || booted()) return;
          recovering = true;

          if (already()) {
            giveUp();
            return;
          }

          try {
            sessionStorage.setItem(RECOVERY_KEY, "1");
          } catch (error) {
            /* see `already` */
          }

          var note = document.getElementById("boot-note");
          if (note) note.textContent = "Updating to the latest version…";

          // A changed query string is a different URL, so the cached copy of
          // this page is bypassed and the new bundle name comes with it.
          var url = new URL(window.location.href);
          url.searchParams.set("v", Date.now().toString(36));
          window.location.replace(url.toString());
        };

        // A module script that 404s, or that the browser refuses because it
        // was served as HTML, reports here.
        window.addEventListener(
          "error",
          function (event) {
            var target = event.target;
            if (target && target.tagName === "SCRIPT" && target.src) recover();
          },
          true,
        );

        // And a backstop, for the failures that report nothing at all.
        window.setTimeout(function () {
          if (!booted()) recover();
        }, GRACE_MS);
      })();
    </script>

    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
