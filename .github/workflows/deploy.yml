# Builds the app and publishes it to GitHub Pages at trivia.omniflexfitness.com.
#
# The custom domain is set in the repository's Pages settings, not here: a
# CNAME file in the build output is ignored when Pages publishes from a
# workflow. Settings > Pages must have Source = "GitHub Actions" for this to
# run at all — see DEPLOYMENT.md for the one-time setup.
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Build pull requests too, so a broken build is caught before it reaches the
  # live site. Only master deploys.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The Firebase web config is what lets phones join the host's game. It
      # is public by design — it names the project, and the rules in
      # firebase/database.rules.json are what protect a room — so it lives in
      # repository *variables* rather than secrets. Absent, the site still
      # builds and runs, with joining limited to one browser.
      #
      # No VITE_ANTHROPIC_API_KEY here, deliberately: that one IS a secret,
      # Vite inlines VITE_* vars into the public bundle, and a key passed at
      # this step would be readable by anyone who loads the site. The deployed
      # app is the import-your-own-questions path; generation stays on the
      # host's machine.
      - name: Build
        run: npm run build
        env:
          # Variables are the right home for these — they are public values, and
          # a variable can be read back when you are checking your own work.
          # Secrets are accepted too: GitHub offers that tab first, putting a
          # non-secret there is a harmless mistake, and a build that silently
          # ignores six correctly-entered values is not a harmless one.
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY || secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN || secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL: ${{ vars.VITE_FIREBASE_DATABASE_URL || secrets.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID || secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID || secrets.VITE_FIREBASE_APP_ID }}
          # The generation proxy's URL — also public, and also useless without
          # a Firebase sign-in it accepts. The Anthropic key it fronts lives in
          # Cloudflare, set with `wrangler secret put`, and never comes here.
          VITE_ANTHROPIC_PROXY_URL: ${{ vars.VITE_ANTHROPIC_PROXY_URL || secrets.VITE_ANTHROPIC_PROXY_URL }}

      # A site that quietly lost its multiplayer is hard to spot from a green
      # tick, so the run says which one it just published.
      - name: Report what was built
        # Read through the environment rather than pasting values into the
        # script: a value that happens to contain shell syntax is then data,
        # not code, and secrets can be tested the same way as variables.
        env:
          FIREBASE_DB: ${{ vars.VITE_FIREBASE_DATABASE_URL || secrets.VITE_FIREBASE_DATABASE_URL }}
          PROXY_URL: ${{ vars.VITE_ANTHROPIC_PROXY_URL || secrets.VITE_ANTHROPIC_PROXY_URL }}
        run: |
          if [ -n "$FIREBASE_DB" ]; then
            echo "::notice::Multiplayer is on — phones can join rooms on this build."
          else
            echo "::warning::No Firebase configuration found, so this build is single-browser only. Set the five VITE_FIREBASE_* values as repository variables (or secrets). See MULTIPLAYER.md."
          fi

          # Generation through the proxy is gated on the caller proving who it
          # is, and that proof is the Firebase sign-in above — so a proxy URL
          # without Firebase is a proxy that refuses every request.
          if [ -z "$PROXY_URL" ]; then
            echo "::warning::No generation proxy set, so hosts on this build import questions from CSV. See worker/README.md."
          elif [ -z "$FIREBASE_DB" ]; then
            echo "::error::A generation proxy is set but Firebase is not, so every generation will be refused by the proxy. Set the VITE_FIREBASE_* values too."
          else
            echo "::notice::Question generation is on, through the proxy."
          fi

      # Pages serves its own 404 page for unknown paths. Hand those to the app
      # instead, so a mistyped URL still lands on the game.
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
