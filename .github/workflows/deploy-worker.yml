# Deploys the question-generation proxy to Cloudflare whenever master moves.
#
# The Worker used to be deployed by hand, from whichever machine last ran
# `npm run worker:deploy`. That is how the repository and the live Worker came
# apart: worker/src/index.ts gained the headers the Anthropic SDK sends, the
# deployed Worker never did, and every generation on the site came back as
# placeholder questions while `git log` looked perfectly healthy.
#
# Nothing here is deployed by hand any more, and a deploy that does not take is
# a red tick rather than a silence.
name: Deploy the question proxy

on:
  push:
    # master is this repository's trunk and the only branch that exists today.
    # `live` is listed ahead of time so that promoting a release branch later
    # is a branch push and nothing else — no one has to remember to come back
    # and edit this file, which is the kind of forgetting that left the Worker
    # four days behind the repository in the first place. A branch that is
    # never pushed is a trigger that never fires, so listing it costs nothing.
    #
    # Both deploy the same Worker. If `live` ever becomes real, treat master
    # and live as one line of history — merge master into live rather than
    # letting them diverge, or the deployed Worker is whichever branch was
    # pushed last rather than whichever is newer.
    branches: [master, live]
  # For redeploying without an empty commit — after rotating the Anthropic key,
  # or to put the Worker back in step if it is ever changed from the dashboard.
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and let a running one finish: two `wrangler deploy`
# runs racing decide the live version by whichever finishes last, which is not
# necessarily the newer commit.
concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Without this the first failure is wrangler's, which reads like a broken
      # Worker rather than a repository missing two settings. Failing here is
      # deliberate: a skip would be a Worker silently left on an old version,
      # which is the whole bug this workflow is here to stop.
      - name: Check the Cloudflare credentials exist
        env:
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — the Worker was NOT deployed. See worker/README.md, 'Deploying automatically'."
            exit 1
          fi

      - name: Deploy the Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config worker/wrangler.toml

      # Why the deploy failed, in words, when it does.
      #
      # wrangler prints the real reason inside a collapsed `::group::`, so what
      # GitHub surfaces at the top of a failed run is "The process
      # '/usr/local/bin/npx' failed with exit code 1" — true, and useless.
      # Worse with debug logging on, where it is buried in a thousand lines of
      # `##[debug]`. So on failure, ask the Cloudflare API the two questions
      # that separate the usual causes and say which one it is.
      #
      # This runs only after a failure and always exits 0: the job is already
      # red from the step above, and a diagnostic that can itself fail is a
      # diagnostic that can lie about what went wrong.
      - name: Say why the deploy failed
        if: failure()
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # `failure()` also fires when the credential check above failed, and
          # that step has already said the useful thing. Probing with an empty
          # token would only add a second, wronger explanation.
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "The credential check above already named what is missing."
            exit 0
          fi

          probe() {
            curl -sS --max-time 20 -H "Authorization: Bearer $CF_TOKEN" "$1" 2>/dev/null || true
          }

          # The decisive question first: can this token see this account's
          # Workers at all? Deploying needs strictly more than that.
          scripts=$(probe "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts")

          if printf '%s' "$scripts" | grep -q '"success":true'; then
            echo "::error::The token can read this account's Workers, so the failure above is narrower than a missing account permission. The usual cause is the zone-level 'Workers Routes' permission: worker/wrangler.toml claims trivia-api.omniflexfitness.com and play.omniflexfitness.com as custom domains, and updating those needs edit access to the omniflexfitness.com zone. Expand 'Running Wrangler Commands' in the step above for wrangler's own message."
            exit 0
          fi

          # It cannot. Distinguish a token that is refused outright from one
          # that is accepted but not allowed to touch Workers.
          verify=$(probe "https://api.cloudflare.com/client/v4/user/tokens/verify")

          if printf '%s' "$verify" | grep -q '"success":true'; then
            echo "::error::CLOUDFLARE_API_TOKEN is a valid token but cannot read this account's Workers, so it certainly cannot deploy one — it is missing the account-level 'Workers Scripts' permission. Recreate it from the 'Edit Cloudflare Workers' template (Cloudflare -> My Profile -> API Tokens -> Create Token), include the omniflexfitness.com zone, and replace the repository secret. See worker/README.md."
          else
            echo "::error::CLOUDFLARE_API_TOKEN was rejected before any permission was checked — revoked, expired, pasted with a stray character, or an account-scoped token this check cannot verify. Recreate it from the 'Edit Cloudflare Workers' template, include the omniflexfitness.com zone, and replace the repository secret. See worker/README.md."
          fi

          # The API's own words, which name the permission group when it is one.
          # No secret appears in an error body; the token is never echoed.
          echo "Cloudflare replied: $(printf '%s' "$scripts" | head -c 400)"
          exit 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Prove the Worker that is now answering is the one just deployed.
      #
      # A green `wrangler deploy` says Cloudflare accepted the upload, not that
      # the Worker on the far side of the DNS name behaves. check-proxy-gates
      # asks it the questions a browser would — including the preflight, which
      # is the one that was failing — and every check in it is a refusal, so it
      # costs nothing and spends nothing against the Anthropic key.
      - name: Check the deployed Worker
        run: |
          for attempt in 1 2 3 4 5 6; do
            if [ "$(curl -fsS --max-time 10 "$PROXY_URL/health" || true)" = "ok" ]; then
              break
            fi
            echo "Not answering yet; waiting for the deploy to propagate ($attempt/6)."
            sleep 10
          done
          npm run check-proxy-gates
        env:
          PROXY_URL: https://trivia-api.omniflexfitness.com
