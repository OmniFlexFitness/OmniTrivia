# The question-generation proxy. Deploy from this directory:
#
#   cd worker
#   npx wrangler@latest secret put ANTHROPIC_API_KEY     # once, and never in git
#   npx wrangler@latest deploy
#
name = "omnitrivia-generate"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Where the Worker answers. Without one of these it has no address at all:
# wrangler refuses to deploy and offers to register a workers.dev subdomain
# instead. omniflexfitness.com is already on Cloudflare, so it can answer on
# its own name and Cloudflare creates the DNS record itself — no workers.dev
# subdomain, and an API on the brand rather than on a shared one.
[[routes]]
pattern = "trivia-api.omniflexfitness.com"
custom_domain = true

# A shorter second address for the same Worker. Both are equivalent — a Worker
# can answer on as many names as it is given — so VITE_ANTHROPIC_PROXY_URL may
# name either, and changing between them is a redeploy of the site, not of this.
[[routes]]
pattern = "play.omniflexfitness.com"
custom_domain = true

[vars]
# Not secret: the project whose Firebase sign-ins this proxy trusts, and the
# sites allowed to call it. The key is a secret and is set with `wrangler
# secret put`, never here.
FIREBASE_PROJECT_ID = "omnitrivia-c3a93"
ALLOWED_ORIGINS = "https://trivia.omniflexfitness.com,http://localhost:5173"

# One device, twenty generations a minute — far past hosting a game, far short
# of a useful amount of someone else's Anthropic balance. If wrangler rejects
# this block, delete it: the Worker checks for the binding before using it.
[[ratelimits]]
name = "GENERATION_LIMIT"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 20
  period = 60
